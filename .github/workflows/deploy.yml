name: CI/CD Jeogieottae

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Give execute permission to gradlew
        run: chmod +x gradlew

      # -------------------------------
      # BuildKit + Gradle 캐시 적용
      # -------------------------------
      - name: Build Docker Image with Gradle cache
        run: |
          # BuildKit 활성화
          export DOCKER_BUILDKIT=1
          
          # Docker BuildKit 캐시 적용
          docker build \
            --build-arg GRADLE_USER_HOME=/home/gradle/.gradle \
            --mount=type=cache,target=/home/gradle/.gradle \
            -t ${{ secrets.DOCKER_USERNAME }}/jeogieottaeserver:latest .

      - name: Check Docker Username
        run: echo "DOCKER_USERNAME is ${{ secrets.DOCKER_USERNAME }}"

      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/jeogieottaeserver:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Pull latest Docker image"
            docker pull ${{ secrets.DOCKER_USERNAME }}/jeogieottaeserver:latest
            
            echo "Stop and remove old container"
            docker stop jeogieottae || true
            docker rm jeogieottae || true
            
            echo "Run new container"
            docker run -d --name jeogieottae -p 8080:8080 \
              -e SPRING_DATASOURCE_URL=jdbc:mysql://EC2_DB_PRIVATE_IP:3306/sparta \
              -e SPRING_DATASOURCE_USERNAME=root \
              -e SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD} \
              -e SPRING_REDIS_HOST=EC2_REDIS_PRIVATE_IP \
              -e SPRING_REDIS_PORT=6379 \
              ${{ secrets.DOCKER_USERNAME }}/jeogieottaeserver:latest
